<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Redirect Page</title>
  <style>
    body {
      text-align: center;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #4facfe, #00f2fe);
      color: white;
      margin: 0;
      padding: 20px;
    }
    .container {
      max-width: 800px;
      margin: auto;
      background: rgba(255,255,255,0.1);
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0 0 15px rgba(0,0,0,0.2);
    }
    h2 {
      font-size: 28px;
      margin-bottom: 15px;
    }
    #redirectBtn {
      background: #ff5722;
      color: white;
      border: none;
      padding: 12px 25px;
      border-radius: 8px;
      font-size: 18px;
      cursor: not-allowed;
      margin-top: 20px;
      transition: background 0.3s;
    }
    #redirectBtn.active {
      cursor: pointer;
      background: #28a745;
    }
    #redirectBtn.active:hover {
      background: #218838;
    }
    .ads {
      margin: 25px 0;
      padding: 10px;
      background: rgba(255, 255, 255, 0.15);
      border-radius: 10px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>🚀 Please wait...</h2>
    <p id="countdown">Redirect button will be available in 5 seconds</p>
    <button id="redirectBtn" disabled>Redirect</button>

    <!-- Banner Ads -->
    <div class="ads banner">
      <!-- Banner 468×60 -->
      <script type="text/javascript">
        atOptions = {
          'key' : '4d58868d7ececb9e7c7af77d0a62171c',
          'format' : 'iframe',
          'height' : 60,
          'width' : 468,
          'params' : {}
        };
      </script>
      <script type="text/javascript" src="//timesmonarchcivil.com/4d58868d7ececb9e7c7af77d0a62171c/invoke.js"></script>
    </div>

    <div class="ads banner">
      <!-- Banner 728×90 -->
      <script type="text/javascript">
        atOptions = {
          'key' : '1896160c5b7396d353e27af8485a6b57',
          'format' : 'iframe',
          'height' : 90,
          'width' : 728,
          'params' : {}
        };
      </script>
      <script type="text/javascript" src="//timesmonarchcivil.com/1896160c5b7396d353e27af8485a6b57/invoke.js"></script>
    </div>

    <div class="ads banner">
      <!-- Banner 300×250 -->
      <script type="text/javascript">
        atOptions = {
          'key' : '6348a3ff0c25858f661070cc53058183',
          'format' : 'iframe',
          'height' : 250,
          'width' : 300,
          'params' : {}
        };
      </script>
      <script type="text/javascript" src="//timesmonarchcivil.com/6348a3ff0c25858f661070cc53058183/invoke.js"></script>
    </div>
  </div>

  <!-- Popunder -->
  <script type='text/javascript' src='//timesmonarchcivil.com/3c/8b/dd/3c8bdd6f292f6c7220331d28898e31d9.js'></script>  

  <!-- Social Bar -->
  <script type='text/javascript' src='//timesmonarchcivil.com/cd/1a/d2/cd1ad2038856f1f3c813a41c3c40d468.js'></script>  

  <script>
    // countdown timer
    let timeLeft = 5;
    const countdownEl = document.getElementById("countdown");
    const redirectBtn = document.getElementById("redirectBtn");

    const timer = setInterval(() => {
      timeLeft--;
      countdownEl.textContent = `Redirect button will be available in ${timeLeft} seconds`;
      if (timeLeft <= 0) {
        clearInterval(timer);
        countdownEl.textContent = "You can now click the button.";
        redirectBtn.disabled = false;
        redirectBtn.classList.add("active");
        redirectBtn.onclick = (e) => {
          e.stopPropagation(); // منع فتح smartlink عند الضغط على الزر
          window.location.href = "https://tinywow.com/";
        };
      }
    }, 1000);

    // Smartlink logic (once only)
    let smartlinkOpened = false;
    document.body.addEventListener("click", function(e) {
      const target = e.target;

      if (
        target.id === "redirectBtn" ||
        target.closest(".banner")
      ) {
        return;
      }

      if (!smartlinkOpened) {
        smartlinkOpened = true;
        window.open("https://timesmonarchcivil.com/xava742ge4?key=e36e1ce86397b1eb530fbfa792c9d175", "_blank");
      }
    });
  </script>
</body>
</html>
